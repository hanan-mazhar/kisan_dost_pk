name: kisan_dost_pk
description: Kisan Dost PK - Empowering Farmers, Connecting Futures
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase (Spark plan - NO Storage)
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_messaging: 

  # State Management
  provider: ^6.1.1

  # UI & Design
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0

  # Charts
  fl_chart: ^0.66.2

  # Image (local only, no cloud upload)
  image_picker: ^1.0.7

  # Local file storage (replaces Firebase Storage)
  path_provider: ^2.1.2

  # Cache & Offline
  shared_preferences: ^2.2.2

  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  
  url_launcher: ^6.2.4
  permission_handler: ^11.3.0
  connectivity_plus: ^5.0.2

  # Notifications
  flutter_local_notifications: ^17.0.0

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/images/Products/
